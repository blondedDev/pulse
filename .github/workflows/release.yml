name: Release

on:
  push:
    tags:
      # Both spellings: 4.1 would not match "v*", and the 4.0 tag that already
      # exists is the bare form. Digit-first catches 4.1, 4.1.0 and so on.
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Build linux-x86_64
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root

    steps:
      - name: Install build dependencies
        run: |
          # The list has to cover everything pkg-config is asked for at build
          # time, not just what the binary links: `yeslogic-fontconfig-sys`
          # (via font-kit) and `xkbcommon-x11` are probed by their build
          # scripts, and a missing one fails the build with a bare exit 101
          # ten minutes in.
          pacman -Syu --noconfirm --needed \
            base-devel rust cargo git nodejs npm \
            pipewire alsa-lib clang cmake pkgconf curl \
            fontconfig freetype2 \
            libxkbcommon libxkbcommon-x11 libxcb libx11 wayland \
            vulkan-icd-loader

      - name: Check build-time pkg-config dependencies
        run: |
          missing=0
          for module in fontconfig freetype2 xkbcommon xkbcommon-x11 alsa; do
            if pkg-config --exists "$module"; then
              echo "ok   $module $(pkg-config --modversion "$module")"
            else
              echo "MISSING $module" >&2
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - name: Build the remote UI
        run: |
          if [ -f web/package.json ]; then
            cd web && npm ci && npm run build
          fi

      # `crates/discord/build.rs` reads the repo-root `.env` and nothing else,
      # so a plain env var on the cargo step would do nothing: the value has to
      # be a file before the build starts. `.env` is gitignored, which is why
      # release binaries used to ship without Discord presence. The application
      # id is a public identifier (it sits inside every running client), so it
      # is written here instead of being kept as a secret.
      - name: Bake in the Discord application id
        run: printf 'DISCORD_CLIENT_ID=%s\n' '1565989158579740733' > .env

      - name: Build Pulse
        run: cargo build --release -p pulse

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/pulse dist/
          cp LICENSE README.md dist/
          cd dist
          tar -czf "../pulse-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" .
          cd ..
          # Name the checksum after the archive explicitly: a glob in the
          # redirect target does not expand, and the uploaded asset ended up
          # called "pulse-.tar.gz.sha256".
          ARCHIVE="pulse-${GITHUB_REF_NAME}-x86_64-linux.tar.gz"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      # A single-file build for people who would rather not unpack anything.
      # The in-app updater replaces the AppImage it was started from, so this
      # asset is not just a convenience: it is the update path for those users.
      - name: Build the AppImage
        run: |
          packaging/build-appimage.sh "${GITHUB_REF_NAME}"
          APPIMAGE="Pulse-${GITHUB_REF_NAME}-x86_64.AppImage"
          sha256sum "$APPIMAGE" > "$APPIMAGE.sha256"

      # The release body is the changelog section for this tag, then the
      # install instructions. `generate_release_notes` would replace both with
      # commit titles, and the app shows the same body, so it is deliberately
      # not used.
      - name: Collect release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 scripts/changelog_section.py "$GITHUB_REF_NAME" > release-notes.md
          printf '\n---\n\n' >> release-notes.md
          cat .github/release-footer.md >> release-notes.md

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pulse-*.tar.gz
            pulse-*.tar.gz.sha256
            Pulse-*.AppImage
            Pulse-*.AppImage.sha256
          body_path: release-notes.md
