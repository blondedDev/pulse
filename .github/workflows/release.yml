name: Release

on:
  push:
    tags:
      # Both spellings: 4.1 would not match "v*", and the 4.0 tag that already
      # exists is the bare form. Digit-first catches 4.1, 4.1.0 and so on.
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Build linux-x86_64
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root

    steps:
      - name: Install build dependencies
        run: |
          # The list has to cover everything pkg-config is asked for at build
          # time, not just what the binary links: `yeslogic-fontconfig-sys`
          # (via font-kit) and `xkbcommon-x11` are probed by their build
          # scripts, and a missing one fails the build with a bare exit 101
          # ten minutes in.
          pacman -Syu --noconfirm --needed \
            base-devel rust cargo git nodejs npm \
            pipewire alsa-lib clang cmake pkgconf \
            fontconfig freetype2 \
            libxkbcommon libxkbcommon-x11 libxcb libx11 wayland \
            vulkan-icd-loader

      - name: Check build-time pkg-config dependencies
        run: |
          missing=0
          for module in fontconfig freetype2 xkbcommon xkbcommon-x11 alsa; do
            if pkg-config --exists "$module"; then
              echo "ok   $module $(pkg-config --modversion "$module")"
            else
              echo "MISSING $module" >&2
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - name: Build the remote UI
        run: |
          if [ -f web/package.json ]; then
            cd web && npm ci && npm run build
          fi

      - name: Build Pulse
        run: cargo build --release -p pulse

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/pulse dist/
          cp LICENSE README.md dist/
          cd dist
          tar -czf "../pulse-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" .
          cd ..
          sha256sum pulse-*.tar.gz > pulse-*.tar.gz.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pulse-*.tar.gz
            pulse-*.tar.gz.sha256
          generate_release_notes: true
          body: |
            Prebuilt for **x86_64 Linux**.

            ```sh
            tar -xzf pulse-${{ github.ref_name }}-x86_64-linux.tar.gz
            install -m 755 pulse ~/.local/bin/pulse
            ```

            Requires PipeWire with `pipewire-alsa`, plus `alsa-lib`,
            `libxkbcommon` and `libxcb` at runtime.
