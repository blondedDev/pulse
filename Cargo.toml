[workspace]
resolver = "2"
members = [
    "crates/audio_common",
    "crates/audio_decoder",
    "crates/audio_output",
    "crates/audio_engine",
    "crates/music_library",
    "crates/music_indexer",
    "crates/media_integration",
    "crates/discord",
    "crates/pulse",
    "crates/pulse_remote",
    "crates/ui_components",
    "crates/ui_resources",
    "crates/cue_parser",
    "crates/diagnostics",
    "crates/lyrics",
    "crates/tag_writer",
    "crates/dsd",
    "crates/cover_search"
]

default-members = ["crates/pulse"]


[workspace.package]
publish = false
# Shown in Settings → General → Version.
version = "5.3.0"
edition = "2024"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = [
    "font-kit",
    "x11",
    "wayland",
] }
gpui-component = "=0.7.0"
anyhow = "1.0"
rust-embed = "8"
log = "0.4"
diagnostics = { path = "crates/diagnostics" }

[profile.release]
debug = false
lto = "thin"
codegen-units = 16

[workspace.lints.rust]
unsafe_code = "forbid"
