[package]
name = "audio_output"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
audio_common = { path = "../audio_common" }
anyhow = { workspace = true }
log = { workspace = true }

cpal = "0.17.3"
rb = "0.4"
parking_lot = "0.12.5"
atomic_float = "1.1.0"

libc = "0.2"

alsa = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "allow"

[lib]
path = "src/output.rs"
