[package]
name = "media_integration"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
flume = "0.12.0"
log = { workspace = true }

# Pure-Rust zbus backend so the build needs no system libdbus headers.
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

[lints.rust]
unsafe_code = "forbid"
